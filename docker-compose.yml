name: ${COMPOSE_PROJECT_NAME:-ecommerce-app}

services:
  db:
    build:
      context: ./db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ${COMPOSE_DB_USER:?Set COMPOSE_DB_USER in .env}
      MYSQL_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=tcp --host=127.0.0.1 --user="$${MYSQL_USER}"
          --password="$${MYSQL_PASSWORD}" "$${MYSQL_DATABASE}"
          --execute='SELECT 1 FROM users LIMIT 0' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  auth-service:
    build:
      context: ./services/auth-service
    restart: unless-stopped
    environment:
      PORT: 4001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${COMPOSE_DB_USER:?Set COMPOSE_DB_USER in .env}
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
      DB_NAME: ecommerce_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  catalog-service:
    build:
      context: ./services/catalog-service
    restart: unless-stopped
    environment:
      PORT: 4002
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${COMPOSE_DB_USER:?Set COMPOSE_DB_USER in .env}
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
      DB_NAME: ecommerce_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  order-service:
    build:
      context: ./services/order-service
    restart: unless-stopped
    environment:
      PORT: 4003
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${COMPOSE_DB_USER:?Set COMPOSE_DB_USER in .env}
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
      DB_NAME: ecommerce_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8080}:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/products || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
