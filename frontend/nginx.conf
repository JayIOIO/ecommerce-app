# NGINX inside the frontend image serves the compiled React/Vite files.
server {
  # Match the internal frontend port expected by the public proxy.
  listen 8080;
  server_name _;
  # Vite's production build is copied into this directory in the Dockerfile.
  root /usr/share/nginx/html;
  index index.html;

  # Compose uses this simple response to determine frontend readiness.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Serve real files directly; otherwise let React handle the client-side URL.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
