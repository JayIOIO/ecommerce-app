# Public NGINX reverse proxy; Compose publishes host traffic to port 8080.
server {
  listen 8080;
  server_name _;
  # Docker's embedded DNS resolves Compose service names on app-network.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Define the internal destinations for browser pages and API requests.
  set $frontend_upstream frontend:8080;
  set $auth_upstream auth-service:4001;
  set $catalog_upstream catalog-service:4002;
  set $order_upstream order-service:4003;

  # Compose readiness probe: confirms the proxy process responds.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Return the image tag inserted by proxy/Dockerfile at build time.
  location = /version {
    default_type text/plain;
    return 200 "__APP_VERSION__";
  }

  # Forward authentication routes to the auth API, keeping the /api/auth path.
  location ^~ /api/auth {
    proxy_pass http://$auth_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Forward catalog/search/listing routes to the catalog API.
  location ^~ /api/products {
    proxy_pass http://$catalog_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Forward checkout and order routes to the order API.
  location ^~ /api/orders {
    proxy_pass http://$order_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # All non-API browser requests go to the static React frontend.
  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
