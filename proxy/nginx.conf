server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $frontend_upstream frontend:8080;
  set $auth_upstream auth-service:4001;
  set $catalog_upstream catalog-service:4002;
  set $order_upstream order-service:4003;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location = /version {
    default_type text/plain;
    return 200 "__APP_VERSION__";
  }

  location ^~ /api/auth {
    proxy_pass http://$auth_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/products {
    proxy_pass http://$catalog_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/orders {
    proxy_pass http://$order_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
